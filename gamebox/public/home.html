<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏社区盒子 | 科技版</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
:root {
    --bg-main: #0a0e17;
    --bg-card: #111827;
    --border-color: #1e293b;
    --primary: #0ea5e9;
    --primary-glow: rgba(14, 165, 233, 0.4);
    --text-main: #e2e8f0;
    --text-sub: #94a3b8;
    --success: #10b981;
    --purple: #8b5cf6;
    --danger: #ef4444;
}
html, body {
    width: 100%;
    overflow-x: hidden;
}
body {
    background: 
        radial-gradient(circle at 20% 20%, rgba(14, 165, 233, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
        linear-gradient(135deg, #0a0e17 0%, #0f172a 100%);
    background-attachment: fixed;
    color: var(--text-main);
    min-height: 100vh;
    line-height: 1.6;
    position: relative;
}
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(14, 165, 233, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14, 165, 233, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
}
.navbar {
    height: 56px;
    background: rgba(17, 24, 39, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}
.nav-inner {
    max-width: 1400px;
    height: 100%;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
}
.nav-logo {
    font-size: 16px;
    font-weight: 700;
    background: linear-gradient(90deg, #0ea5e9, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.5px;
}
.nav-user {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
}
.user-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #fff;
    font-size: 12px;
    box-shadow: 0 0 12px var(--primary-glow);
}
.logout-btn {
    padding: 5px 12px;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-sub);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
}
.logout-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.container {
    max-width: 1400px;
    margin: 20px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 20px;
    align-items: start;
    position: relative;
    z-index: 1;
}

.sidebar {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 12px 0;
    position: sticky;
    top: 76px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.menu-item {
    padding: 10px 20px;
    font-size: 14px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.25s;
    border-left: 3px solid transparent;
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
}
.menu-item:hover {
    background: rgba(14, 165, 233, 0.08);
    color: var(--primary);
}
.menu-item.active {
    background: rgba(14, 165, 233, 0.12);
    color: var(--primary);
    border-left-color: var(--primary);
    font-weight: 500;
}
.badge {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 10px;
    min-width: 16px;
    text-align: center;
}

.sidebar-stats {
    margin: 12px 14px 0;
    padding: 12px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-sub);
}
.stat-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
}
.stat-row:last-child {
    margin-bottom: 0;
}
.stat-num {
    color: var(--primary);
    font-weight: 600;
}

.main {
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.panel {
    display: none;
    flex-direction: column;
    gap: 16px;
}
.panel.active {
    display: flex;
}

.card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    transition: all 0.3s;
    position: relative;
}
.card:hover {
    border-color: rgba(14, 165, 233, 0.4);
}
.card-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text-main);
}
.card-title-left {
    display: flex;
    align-items: center;
    gap: 8px;
}
.card-title-left::before {
    content: "";
    width: 3px;
    height: 14px;
    background: linear-gradient(180deg, #0ea5e9, #8b5cf6);
    border-radius: 2px;
}

.notice-bar {
    padding: 10px 14px;
    background: linear-gradient(90deg, rgba(14, 165, 233, 0.15), rgba(139, 92, 246, 0.15));
    border: 1px solid rgba(14, 165, 233, 0.3);
    border-radius: 8px;
    font-size: 12px;
    color: #7dd3fc;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
}

input, textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    background: #0f172a;
    color: var(--text-main);
    transition: all 0.2s;
    margin-bottom: 10px;
}
input:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
}
textarea {
    resize: vertical;
    min-height: 80px;
}
.btn {
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #0ea5e9, #2563eb);
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
}
.btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(14, 165, 233, 0.35);
}
.btn-sm {
    padding: 4px 10px;
    font-size: 12px;
}
.btn-ghost {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-sub);
    box-shadow: none;
}
.btn-ghost:hover {
    border-color: var(--primary);
    color: var(--primary);
    transform: none;
    box-shadow: none;
}
.btn-danger {
    background: var(--danger);
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
}

.sort-group {
    display: flex;
    gap: 6px;
}
.sort-btn {
    padding: 4px 10px;
    font-size: 11px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
}
.sort-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
}

.post-item {
    padding: 14px;
    background: #0f172a;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    margin-bottom: 10px;
    transition: all 0.2s;
}
.post-item:hover {
    border-color: rgba(14, 165, 233, 0.3);
}
.post-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}
.post-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
}
.post-meta {
    font-size: 11px;
    color: var(--text-sub);
}
.post-content {
    font-size: 13px;
    color: var(--text-main);
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 8px;
}
.post-footer {
    display: flex;
    gap: 14px;
    padding-top: 6px;
    border-top: 1px solid var(--border-color);
}
.post-action {
    font-size: 11px;
    color: var(--text-sub);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: color 0.2s;
    user-select: none;
}
.post-action:hover {
    color: var(--primary);
}
.post-action.liked {
    color: var(--primary);
}

/* 回复区样式 */
.comment-section {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border-color);
}
.comment-list {
    margin-bottom: 8px;
}
.comment-item {
    padding: 6px 8px;
    margin-bottom: 6px;
    background: rgba(15, 23, 42, 0.6);
    border-radius: 6px;
    font-size: 12px;
}
.comment-user {
    color: var(--primary);
    font-weight: 500;
    margin-right: 6px;
}
.comment-time {
    color: var(--text-sub);
    font-size: 10px;
    margin-left: 6px;
}
.comment-input-row {
    display: flex;
    gap: 6px;
}
.comment-input {
    flex: 1;
    margin-bottom: 0;
    padding: 6px 10px;
    font-size: 12px;
}

.game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
}
.game-card {
    background: #0f172a;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s;
}
.game-card:hover {
    transform: translateY(-3px);
    border-color: var(--primary);
    box-shadow: 0 8px 24px rgba(14, 165, 233, 0.2);
}
.game-cover {
    height: 100px;
    background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    position: relative;
}
.game-cover::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 40%;
    background: linear-gradient(transparent, rgba(0,0,0,0.3));
}
.game-info {
    padding: 10px;
}
.game-name {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.game-meta {
    font-size: 11px;
    color: var(--text-sub);
    display: flex;
    justify-content: space-between;
}
.play-count {
    color: var(--success);
}

.del-btn {
    margin-top: 8px;
    width: 100%;
    padding: 4px 0;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #ef4444;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
}
.del-btn:hover {
    background: rgba(239, 68, 68, 0.3);
    border-color: #ef4444;
}

.search-box {
    position: relative;
    margin-bottom: 14px;
}
.search-box input {
    margin-bottom: 0;
    padding-left: 34px;
}
.search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-sub);
    font-size: 14px;
}

.empty {
    padding: 30px;
    text-align: center;
    color: var(--text-sub);
    font-size: 13px;
    border: 1px dashed var(--border-color);
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.5);
    grid-column: 1/-1;
}

.upload-form {
    display: none;
    margin-bottom: 18px;
    padding: 14px;
    background: #0a0e17;
    border-radius: 8px;
    border: 1px solid var(--border-color);
}
.upload-form.show {
    display: block;
}

/* ========== 好友系统样式 ========== */
.friend-layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 16px;
    height: calc(100vh - 120px);
}
.friend-list-panel {
    background: #0f172a;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.friend-search {
    padding: 10px;
    border-bottom: 1px solid var(--border-color);
}
.friend-search input {
    margin-bottom: 0;
    font-size: 13px;
}
.search-result {
    position: absolute;
    top: 100%;
    left: 10px;
    right: 10px;
    background: #111827;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    max-height: 200px;
    overflow-y: auto;
    z-index: 10;
    display: none;
}
.search-result.show {
    display: block;
}
.search-user-item {
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    font-size: 13px;
}
.search-user-item:last-child {
    border-bottom: none;
}

.friend-tabs {
    display: flex;
    border-bottom: 1px solid var(--border-color);
}
.friend-tab {
    flex: 1;
    padding: 8px;
    text-align: center;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    border-bottom: 2px solid transparent;
}
.friend-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
}

.friend-list {
    flex: 1;
    overflow-y: auto;
}
.friend-item {
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    border-bottom: 1px solid var(--border-color);
    transition: all 0.2s;
}
.friend-item:hover {
    background: rgba(14, 165, 233, 0.08);
}
.friend-item.active {
    background: rgba(14, 165, 233, 0.12);
}
.friend-item-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981, #0ea5e9);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 12px;
}
.friend-item-name {
    flex: 1;
    font-size: 13px;
}
.request-item {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-color);
    font-size: 13px;
}
.request-btns {
    display: flex;
    gap: 6px;
    margin-top: 6px;
}

.chat-panel {
    background: #0f172a;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.chat-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.chat-header-name {
    font-weight: 600;
    font-size: 14px;
}
.chat-actions {
    display: flex;
    gap: 8px;
}
.chat-icon-btn {
    padding: 4px 8px;
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-sub);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}
.chat-icon-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.msg-row {
    display: flex;
    gap: 8px;
    max-width: 70%;
}
.msg-row.self {
    align-self: flex-end;
    flex-direction: row-reverse;
}
.msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
}
.msg-row.self .msg-avatar {
    background: linear-gradient(135deg, #10b981, #0ea5e9);
}
.msg-bubble {
    padding: 8px 12px;
    background: #1e293b;
    border-radius: 10px;
    font-size: 13px;
    word-break: break-word;
}
.msg-row.self .msg-bubble {
    background: linear-gradient(135deg, #0ea5e9, #2563eb);
}
.msg-time {
    font-size: 10px;
    color: var(--text-sub);
    margin-top: 4px;
}
.msg-row.self .msg-time {
    text-align: right;
}
.msg-img {
    max-width: 200px;
    border-radius: 8px;
    display: block;
}
.msg-file {
    padding: 8px 12px;
    background: rgba(14, 165, 233, 0.1);
    border: 1px solid rgba(14, 165, 233, 0.3);
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--primary);
    text-decoration: none;
    font-size: 13px;
}
.msg-game {
    padding: 10px 14px;
    background: rgba(139, 92, 246, 0.15);
    border: 1px solid rgba(139, 92, 246, 0.4);
    border-radius: 8px;
    cursor: pointer;
}
.msg-game-title {
    font-weight: 600;
    color: #a78bfa;
    margin-bottom: 4px;
}
.msg-game-desc {
    font-size: 12px;
    color: var(--text-sub);
}

.chat-input-area {
    padding: 12px 16px;
    border-top: 1px solid var(--border-color);
}
.chat-toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}
.tool-btn {
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-sub);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}
.tool-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
}
.chat-input-row {
    display: flex;
    gap: 8px;
}
.chat-input {
    flex: 1;
    margin-bottom: 0;
}

/* 分享游戏弹窗 */
.modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
}
.modal-mask.show {
    display: flex;
}
.modal {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    width: 400px;
    max-height: 80vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.modal-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border-color);
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.modal-close {
    cursor: pointer;
    color: var(--text-sub);
}
.modal-body {
    padding: 14px 18px;
    overflow-y: auto;
    flex: 1;
}
.share-game-item {
    padding: 10px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.2s;
}
.share-game-item:hover {
    border-color: var(--primary);
    background: rgba(14, 165, 233, 0.08);
}

@media screen and (max-width: 900px) {
    .container {
        grid-template-columns: 1fr;
    }
    .sidebar {
        position: static;
        flex-direction: row;
        overflow-x: auto;
        padding: 6px;
    }
    .menu-item {
        flex-shrink: 0;
        border-left: none;
        border-bottom: 3px solid transparent;
        padding: 8px 14px;
    }
    .menu-item.active {
        border-left: none;
        border-bottom-color: var(--primary);
    }
    .sidebar-stats {
        display: none;
    }
    .game-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    }
    .friend-layout {
        grid-template-columns: 1fr;
        height: auto;
    }
}

@media screen and (max-width: 500px) {
    .nav-logo { font-size: 14px; }
    .nav-user span { display: none; }
    .game-cover { height: 80px; font-size: 28px; }
}
</style>
</head>
<body>

<div class="navbar">
    <div class="nav-inner">
        <div class="nav-logo">🎮 游戏社区盒子</div>
        <div class="nav-user">
            <div class="user-avatar" id="userAvatar">--</div>
            <span id="userName">--</span>
            <button class="logout-btn" onclick="logout()">退出</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="sidebar">
        <div class="menu-item active" onclick="switchPanel('post', this)">
            <span>💬</span> 社区帖子
        </div>
        <div class="menu-item" onclick="switchPanel('square', this)">
            <span>🎯</span> 游戏广场
        </div>
        <div class="menu-item" onclick="switchPanel('library', this)">
            <span>📚</span> 游戏库
        </div>
        <div class="menu-item" onclick="switchPanel('friend', this)">
            <span>👥</span> 好友
            <span class="badge" id="friendBadge" style="display:none;">0</span>
        </div>
        
        <div class="sidebar-stats">
            <div class="stat-row">
                <span>🎮 游戏总数</span>
                <span class="stat-num" id="statGames">0</span>
            </div>
            <div class="stat-row">
                <span>💬 帖子总数</span>
                <span class="stat-num" id="statPosts">0</span>
            </div>
            <div class="stat-row">
                <span>👤 注册用户</span>
                <span class="stat-num" id="statUsers">0</span>
            </div>
        </div>
    </div>

    <div class="main">
        <!-- 社区帖子 -->
        <div class="panel active" id="postPanel">
            <div class="card">
                <div class="notice-bar">
                    <span>📢</span>
                    欢迎来到游戏社区！上传HTML小游戏、分享心得，和大家一起玩～
                </div>
                <div class="card-title">
                    <div class="card-title-left">发布新帖子</div>
                </div>
                <textarea id="postContent" placeholder="分享你的游戏心得、问题讨论或新鲜事..."></textarea>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:12px; color:var(--text-sub);"><span id="charCount">0</span> 字</span>
                    <button class="btn" onclick="sendPost()">发布帖子</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <div class="card-title-left">全部帖子</div>
                </div>
                <div id="postList"></div>
            </div>
        </div>

        <!-- 游戏广场 -->
        <div class="panel" id="squarePanel">
            <div class="card">
                <div class="card-title">
                    <div class="card-title-left">🔥 最新上架</div>
                    <span style="font-size:11px;color:var(--text-sub);font-weight:normal;">云端同步 · 全员可见</span>
                </div>
                <div id="squareGameList" class="game-grid"></div>
            </div>
        </div>

        <!-- 游戏库 -->
        <div class="panel" id="libraryPanel">
            <div class="card">
                <div class="card-title">
                    <div class="card-title-left">📚 全部游戏库</div>
                    <div class="sort-group">
                        <button class="sort-btn active" onclick="sortGames('new', this)">最新发布</button>
                        <button class="sort-btn" onclick="sortGames('hot', this)">最多游玩</button>
                    </div>
                </div>
                
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input id="gameSearch" placeholder="搜索游戏名称或作者..." oninput="searchGames()">
                </div>

                <div style="margin-bottom:14px;">
                    <button class="btn" onclick="toggleUploadForm()">⬆️ 上传新游戏</button>
                </div>
                
                <div class="upload-form" id="uploadForm">
                    <div style="font-weight:500; margin-bottom:8px; font-size:13px;">上传HTML游戏</div>
                    <input id="gameName" placeholder="游戏名称">
                    <textarea id="gameCode" rows="4" placeholder="粘贴完整HTML游戏代码"></textarea>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:11px; color:var(--text-sub);">上传后自动同步云端，所有玩家可见</span>
                        <button class="btn" onclick="uploadGame()">确认上传</button>
                    </div>
                </div>

                <div id="libraryGameList" class="game-grid"></div>
            </div>
        </div>

        <!-- 好友系统 -->
        <div class="panel" id="friendPanel">
            <div class="friend-layout">
                <div class="friend-list-panel">
                    <div class="friend-search" style="position:relative;">
                        <input type="text" id="userSearchInput" placeholder="搜索用户名添加好友..." oninput="searchUser()">
                        <div class="search-result" id="searchResult"></div>
                    </div>
                    <div class="friend-tabs">
                        <div class="friend-tab active" onclick="switchFriendTab('list', this)">好友</div>
                        <div class="friend-tab" onclick="switchFriendTab('request', this)">
                            请求 <span id="reqCount" style="color:var(--danger);"></span>
                        </div>
                    </div>
                    <div class="friend-list" id="friendList"></div>
                    <div class="friend-list" id="requestList" style="display:none;"></div>
                </div>

                <div class="chat-panel">
                    <div class="chat-header">
                        <div class="chat-header-name" id="chatFriendName">选择好友开始聊天</div>
                        <div class="chat-actions">
                            <button class="chat-icon-btn" onclick="showShareModal()">🎮 分享游戏</button>
                            <button class="chat-icon-btn" onclick="inviteOnline()">🔗 联机邀请</button>
                        </div>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <div style="text-align:center;color:var(--text-sub);font-size:13px;padding:40px;">
                            选择左侧好友开始聊天
                        </div>
                    </div>
                    <div class="chat-input-area" id="chatInputArea" style="display:none;">
                        <div class="chat-toolbar">
                            <label class="tool-btn">
                                🖼️ 图片
                                <input type="file" accept="image/*" style="display:none;" onchange="sendImage(event)">
                            </label>
                            <label class="tool-btn">
                                📁 文件
                                <input type="file" style="display:none;" onchange="sendFile(event)">
                            </label>
                        </div>
                        <div class="chat-input-row">
                            <input class="chat-input" id="chatInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMessage()">

                    </div>
                </div>

    </div>

<!-- 分享游戏弹窗 -->
<div class="modal-mask" id="shareModal">
    <div class="modal">
        <div class="modal-header">
            <span>选择要分享的游戏</span>
            <span class="modal-close" onclick="closeShareModal()">✕</span>
        </div>
        <div class="modal-body" id="shareGameList"></div>
    </div>
</div>

<script>
const username = localStorage.getItem("user");
if(!username) window.location.href = "/index.html";

document.getElementById("userName").textContent = username;
document.getElementById("userAvatar").textContent = username.charAt(0).toUpperCase();

const forbiddenWords = ['咸鱼蛋', '汉堡', '李梓墨', '大傻子'];
let allGames = [];
let allPosts = [];
let currentSort = "new";
let currentFriend = null;
let friendList = [];

// ========== 面板切换 ==========
function switchPanel(name, el) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
    
    document.getElementById(name + 'Panel').classList.add('active');
    el.classList.add('active');
    
    if(name === 'post') loadPosts();
    if(name === 'square' || name === 'library') loadAllGames();
    if(name === 'friend') {
        loadFriendList();
        loadFriendRequests();
    }
}

// ========== 帖子功能 ==========
document.getElementById("postContent").addEventListener("input", function(){
    document.getElementById("charCount").textContent = this.value.length;
});

async function updateStats() {
    document.getElementById("statGames").textContent = allGames.length;
    document.getElementById("statPosts").textContent = allPosts.length;
    try {
        const res = await fetch("/api/usercount");
        const data = await res.json();
        document.getElementById("statUsers").textContent = data.count;
    } catch(e) {}
}

async function loadPosts() {
    try {
        const res = await fetch("/api/posts");
        allPosts = await res.json();
        const div = document.getElementById("postList");
        
        if(allPosts.length === 0) {
            div.innerHTML = '<div class="empty">还没有帖子，快来发布第一条吧～</div>';
            updateStats();
            return;
        }

        div.innerHTML = "";
        allPosts.forEach((p, idx) => {
            const liked = p.likedUsers && p.likedUsers.includes(username);
            const item = document.createElement("div");
            item.className = "post-item";
            
            // 回复列表HTML
            let commentsHtml = '';
            if(p.comments && p.comments.length > 0) {
                commentsHtml = '<div class="comment-list">';
                p.comments.forEach(c => {
                    commentsHtml += `
                        <div class="comment-item">
                            <span class="comment-user">${escapeHtml(c.user)}</span>
                            ${escapeHtml(c.content)}
                            <span class="comment-time">${c.time}</span>
                        </div>
                    `;
                });
                commentsHtml += '</div>';
            }

            item.innerHTML = `
                <div class="post-head">
                    <div class="post-avatar">${(p.user || "?").charAt(0).toUpperCase()}</div>
                    <div class="post-meta">
                        <span style="color:var(--text-main); font-weight:500;">${escapeHtml(p.user || "匿名")}</span>
                        &nbsp;·&nbsp; ${escapeHtml(p.time || "")}
                    </div>
                </div>
                <div class="post-content">${escapeHtml(p.content || "")}</div>
                <div class="post-footer">
                    <div class="post-action ${liked ? 'liked' : ''}" onclick="likePost(${idx}, this)">
                        <span>👍</span> <span class="like-num">${p.likeCount || 0}</span> 点赞
                    </div>
                    <div class="post-action" onclick="toggleReply(${idx})">
                        <span>💬</span> 回复
                    </div>
                    ${p.user === username ? `
                    <div class="post-action" style="color: var(--danger)" onclick="deletePost(${idx})">
                        <span>🗑️</span> 删除
                    </div>` : ''}
                </div>
                <div class="comment-section" id="replyBox-${idx}" style="display:none;">
                    ${commentsHtml}
                    <div class="comment-input-row">
                        <input class="comment-input" id="replyInput-${idx}" placeholder="写下你的回复...">
                        <button class="btn btn-sm" onclick="submitReply(${idx})">回复</button>
                    </div>
                </div>
            `;
            div.appendChild(item);
        });
        updateStats();
    } catch(e) {
        document.getElementById("postList").innerHTML = '<div class="empty">帖子加载失败</div>';
    }
}

// 展开/收起回复框
function toggleReply(idx) {
    const box = document.getElementById(`replyBox-${idx}`);
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

// 提交回复
async function submitReply(idx) {
    const input = document.getElementById(`replyInput-${idx}`);
    const content = input.value.trim();
    if(!content) { alert('回复内容不能为空'); return; }
    
    if(forbiddenWords.some(w => content.includes(w))) {
        alert("回复内容包含违禁词，请修改");
        return;
    }

    try {
        const res = await fetch("/api/reply", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ postId: idx, username, content })
        });
        const data = await res.json();
        if(data.success) {
            loadPosts();
        } else {
            alert("回复失败：" + data.msg);
        }
    } catch(e) {
        alert("回复失败");
    }
}

async function likePost(idx, el) {
    if(el.classList.contains('liked')) return;
    try {
        const res = await fetch("/api/like", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({postId: idx, username: username})
        });
        const data = await res.json();
        el.classList.add('liked');
        el.querySelector('.like-num').textContent = data.likeCount;
        allPosts[idx].likeCount = data.likeCount;
    } catch(e) {
        alert("点赞失败");
    }
}

async function deletePost(idx) {
    if(!confirm("确定删除这条帖子？删除后无法恢复。")) return;
    try {
        const res = await fetch(`/api/post/${idx}`, {
            method: "DELETE",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ username: username })
        });
        const data = await res.json();
        if(data.success) {
            loadPosts();
        } else {
            alert("删除失败：" + data.msg);
        }
    } catch(e) {
        alert("删除失败");
    }
}

async function sendPost() {
    const content = document.getElementById("postContent").value;
    if(!content.trim()) {
        alert("帖子内容不能为空！");
        return;
    }

    if(forbiddenWords.some(w => content.includes(w))) {
        alert("帖子内容包含违禁词，请修改后发布");
        return;
    }

    try {
        await fetch("/api/post", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({user: username, content})
        });
        document.getElementById("postContent").value = "";
        document.getElementById("charCount").textContent = "0";
        alert("发布成功！");
        loadPosts();
    } catch(e) {
        alert("发帖失败：" + e.message);
    }
}

// ========== 游戏功能 ==========
async function loadAllGames() {
    try {
        const res = await fetch("/api/games");
        allGames = await res.json();
        
        renderGameList("squareGameList", allGames.slice(0, 6));
        const list = currentSort === "new" ? allGames : [...allGames].sort((a,b) => (b.playCount||0) - (a.playCount||0));
        renderGameList("libraryGameList", list);
        updateStats();
    } catch(e) {
        console.error("游戏加载失败", e);
    }
}

function renderGameList(elementId, list) {
    const div = document.getElementById(elementId);
    if(list.length === 0) {
        div.innerHTML = '<div class="empty">暂无游戏，快去上传第一个吧</div>';
        return;
    }

    div.innerHTML = "";
    list.forEach((g) => {
        const realIndex = allGames.indexOf(g);
        const card = document.createElement("div");
        card.className = "game-card";
        card.onclick = () => playGame(realIndex);
        
        const isOwner = g.user === username;
        card.innerHTML = `
            <div class="game-cover">🎮</div>
            <div class="game-info">
                <div class="game-name">${escapeHtml(g.name || "未命名游戏")}</div>
                <div class="game-meta">
                    <span>作者：${escapeHtml(g.user || "匿名")}</span>
                    <span class="play-count">▶ ${g.playCount || 0}</span>
                </div>
                ${isOwner ? `<button class="del-btn" onclick="event.stopPropagation(); deleteGame(${realIndex})">删除</button>` : ''}
            </div>
        `;
        div.appendChild(card);
    });
}

function searchGames() {
    const keyword = document.getElementById("gameSearch").value.toLowerCase().trim();
    if(!keyword) {
        sortGames(currentSort, document.querySelector('.sort-btn.active'));
        return;
    }
    const filtered = allGames.filter(g => 
        g.name.toLowerCase().includes(keyword) || 
        g.user.toLowerCase().includes(keyword)
    );
    renderGameList("libraryGameList", filtered);
}

function sortGames(type, el) {
    currentSort = type;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    
    let sorted = [...allGames];
    if(type === 'hot') {
        sorted.sort((a,b) => (b.playCount||0) - (a.playCount||0));
    }
    renderGameList("libraryGameList", sorted);
}

function toggleUploadForm() {
    document.getElementById("uploadForm").classList.toggle('show');
}

async function uploadGame() {
    const name = document.getElementById("gameName").value;
    const code = document.getElementById("gameCode").value;

    if(!name.trim() || !code.trim()) {
        alert("请填写游戏名称和完整代码！");
        return;
    }

    try {
        await fetch("/api/uploadgame", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({user: username, name, code})
        });
        
        alert("上传成功！已同步到云端，所有玩家均可看见");
        document.getElementById("gameName").value = "";
        document.getElementById("gameCode").value = "";
        document.getElementById("uploadForm").classList.remove('show');
        loadAllGames();
    } catch(e) {
        alert("上传失败：" + e.message);
    }
}

async function deleteGame(id) {
    if(!confirm("确定要删除这个游戏吗？删除后无法恢复。")) return;
    try {
        const res = await fetch(`/api/game/${id}`, {
            method: "DELETE"
        });
        const data = await res.json();
        if(data.success) {
            alert("删除成功！");
            loadAllGames();
        } else {
            alert("删除失败：" + data.msg);
        }
    } catch(e) {
        alert("删除失败：" + e.message);
    }
}

async function playGame(id) {
    try {
        await fetch(`/api/playgame?id=${id}`);
    } catch(e) {}
    window.location.href = `/game.html?id=${id}`;
}

// ========== 好友系统 ==========
async function searchUser() {
    const keyword = document.getElementById("userSearchInput").value.trim();
    const resultBox = document.getElementById("searchResult");
    
    if(!keyword) {
        resultBox.classList.remove('show');
        return;
    }

    try {
        const res = await fetch(`/api/searchuser?keyword=${encodeURIComponent(keyword)}`);
        const list = await res.json();
        
        if(list.length === 0) {
            resultBox.innerHTML = '<div style="padding:10px;text-align:center;color:var(--text-sub);font-size:12px;">未找到用户</div>';
        } else {
            resultBox.innerHTML = "";
            list.forEach(u => {
                const isFriend = friendList.includes(u);
                const item = document.createElement("div");
                item.className = "search-user-item";
                item.innerHTML = `
                    <span>${escapeHtml(u)}</span>
                    ${isFriend ? '<span style="color:var(--success);font-size:12px;">已添加</span>' : 
                     `<button class="btn btn-sm" onclick="addFriend('${u}')">添加</button>`}
                `;
                resultBox.appendChild(item);
            });
        }
        resultBox.classList.add('show');
    } catch(e) {}
}

async function addFriend(name) {
    try {
        const res = await fetch("/api/friend/request", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({from: username, to: name})
        });
        const data = await res.json();
        if(data.success) {
            alert("好友请求已发送！");
            document.getElementById("searchResult").classList.remove('show');
            document.getElementById("userSearchInput").value = "";
        } else {
            alert(data.msg);
        }
    } catch(e) {
        alert("发送失败");
    }
}

function switchFriendTab(name, el) {
    document.querySelectorAll('.friend-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    
    if(name === 'list') {
        document.getElementById("friendList").style.display = "block";
        document.getElementById("requestList").style.display = "none";
    } else {
        document.getElementById("friendList").style.display = "none";
        document.getElementById("requestList").style.display = "block";
    }
}

async function loadFriendList() {
    try {
        const res = await fetch(`/api/friend/list?username=${encodeURIComponent(username)}`);
        friendList = await res.json();
        
        const div = document.getElementById("friendList");
        if(friendList.length === 0) {
            div.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-sub);font-size:12px;">暂无好友，搜索添加吧</div>';
            return;
        }

        div.innerHTML = "";
        friendList.forEach(f => {
            const item = document.createElement("div");
            item.className = "friend-item";
            item.onclick = () => openChat(f);
            item.innerHTML = `
                <div class="friend-item-avatar">${f.charAt(0).toUpperCase()}</div>
                <div class="friend-item-name">${escapeHtml(f)}</div>
            `;
            div.appendChild(item);
        });
    } catch(e) {}
}

async function loadFriendRequests() {
    try {
        const res = await fetch(`/api/friend/requests?username=${encodeURIComponent(username)}`);
        const list = await res.json();
        
        const badge = document.getElementById("friendBadge");
        if(list.length > 0) {
            badge.style.display = "block";
            badge.textContent = list.length;
            document.getElementById("reqCount").textContent = `(${list.length})`;
        } else {
            badge.style.display = "none";
            document.getElementById("reqCount").textContent = "";
        }

        const div = document.getElementById("requestList");
        if(list.length === 0) {
            div.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-sub);font-size:12px;">暂无好友请求</div>';
            return;
        }

        div.innerHTML = "";
        list.forEach(r => {
            const item = document.createElement("div");
            item.className = "request-item";
            item.innerHTML = `
                <div>${escapeHtml(r.from)} 请求添加你为好友</div>
                <div style="font-size:11px;color:var(--text-sub);">${r.time}</div>
                <div class="request-btns">
                    <button class="btn btn-sm" onclick="handleRequest(${r.id}, true)">同意</button>
                    <button class="btn btn-sm btn-ghost" onclick="handleRequest(${r.id}, false)">拒绝</button>
                </div>
            `;
            div.appendChild(item);
        });
    } catch(e) {}
}

async function handleRequest(id, accept) {
    try {
        await fetch("/api/friend/handle", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({id, accept, username})
        });
        loadFriendRequests();
        loadFriendList();
    } catch(e) {}
}

// ========== 聊天系统 ==========
async function openChat(friend) {
    currentFriend = friend;
    document.getElementById("chatFriendName").textContent = friend;
    document.getElementById("chatInputArea").style.display = "block";
    
    document.querySelectorAll('.friend-item').forEach(i => i.classList.remove('active'));
    event.currentTarget.classList.add('active');
    
    await loadChatHistory();
}

async function loadChatHistory() {
    if(!currentFriend) return;
    try {
        const res = await fetch(`/api/chat/history?user=${encodeURIComponent(username)}&friend=${encodeURIComponent(currentFriend)}`);
        const messages = await res.json();
        
        const div = document.getElementById("chatMessages");
        div.innerHTML = "";
        
        if(messages.length === 0) {
            div.innerHTML = '<div style="text-align:center;color:var(--text-sub);font-size:13px;padding:40px;">开始和 '+currentFriend+' 聊天吧</div>';
            return;
        }

        messages.forEach(msg => {
            renderMessage(msg);
        });
        div.scrollTop = div.scrollHeight;
    } catch(e) {}
}

function renderMessage(msg) {
    const div = document.getElementById("chatMessages");
    const isSelf = msg.from === username;

    const row = document.createElement("div");
    row.className = "msg-row" + (isSelf ? " self" : "");

    let content = "";
    if(msg.type === 'text') {
        content = `<div class="msg-bubble">${escapeHtml(msg.content)}</div>`;
    } else if(msg.type === 'image') {
        content = `<div class="msg-bubble"><img class="msg-img" src="${msg.content}" alt="图片"/></div>`;
    } else if(msg.type === 'file') {
        const file = JSON.parse(msg.content);
        content = `<a class="msg-file" href="${file.data}" download="${file.name}">📁 ${escapeHtml(file.name)}</a>`;
    } else if(msg.type === 'game') {
        const game = JSON.parse(msg.content);
        content = `<div class="msg-game" onclick="playGame(${game.id})">
            <div class="msg-game-title">🎮 ${escapeHtml(game.name)}</div>
            <div class="msg-game-desc">点击开始游戏</div>
        </div>`;
    }

    row.innerHTML = `
        <div class="msg-avatar">${msg.from.charAt(0).toUpperCase()}</div>
        <div>
            ${content}
            <div class="msg-time">${msg.time}</div>
        </div>
    `;
    div.appendChild(row);
    div.scrollTop = div.scrollHeight;
}

async function sendMessage() {
    if(!currentFriend) return;
    const input = document.getElementById("chatInput");
    const content = input.value.trim();
    if(!content) return;

    try {
        await fetch("/api/chat/send", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                from: username,
                to: currentFriend,
                type: 'text',
                content
            })
        });
        input.value = "";
        loadChatHistory();
    } catch(e) {
        alert("发送失败");
    }
}

function sendImage(e) {
    const file = e.target.files[0];
    if(!file || !currentFriend) return;
    
    const reader = new FileReader();
    reader.onload = async () => {
        try {
            await fetch("/api/chat/send", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    from: username,
                    to: currentFriend,
                    type: 'image',
                    content: reader.result
                })
            });
            loadChatHistory();
        } catch(err) {
            alert("发送失败");
        }
    };
    reader.readAsDataURL(file);
    e.target.value = "";
}

function sendFile(e) {
    const file = e.target.files[0];
    if(!file || !currentFriend) return;
    
    const reader = new FileReader();
    reader.onload = async () => {
        try {
            await fetch("/api/chat/send", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    from: username,
                    to: currentFriend,
                    type: 'file',
                    content: JSON.stringify({name: file.name, data: reader.result})
                })
            });
            loadChatHistory();
        } catch(err) {
            alert("发送失败");
        }
    };
    reader.readAsDataURL(file);
    e.target.value = "";
}

// ========== 分享游戏 ==========
function showShareModal() {
    if(!currentFriend) {
        alert("请先选择好友");
        return;
    }
    const modal = document.getElementById("shareModal");
    const list = document.getElementById("shareGameList");

    if(allGames.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:var(--text-sub);padding:20px;">暂无游戏可分享</div>';
    } else {
        list.innerHTML = "";
        allGames.forEach((g, idx) => {
            const item = document.createElement("div");
            item.className = "share-game-item";
            item.onclick = () => shareGame(idx, g.name);
            item.innerHTML = `
                <span style="font-size:24px;">🎮</span>
                <div>
                    <div style="font-weight:500;">${escapeHtml(g.name)}</div>
                    <div style="font-size:12px;color:var(--text-sub);">作者：${escapeHtml(g.user)}</div>
                </div>
            `;
            list.appendChild(item);
        });
    }
    modal.classList.add('show');
}

function closeShareModal() {
    document.getElementById("shareModal").classList.remove('show');
}

async function shareGame(id, name) {
    if(!currentFriend) return;
    try {
        await fetch("/api/chat/send", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                from: username,
                to: currentFriend,
                type: 'game',
                content: JSON.stringify({id, name})
            })
        });
        closeShareModal();
        loadChatHistory();
        alert("游戏分享成功！");
    } catch(e) {
        alert("分享失败");
    }
}

function inviteOnline() {
    if(!currentFriend) {
        alert("请先选择好友");
        return;
    }
    alert("联机功能开发中，敬请期待！\n后续可以直接邀请好友进入联机房间");
}

// ========== 通用 ==========
function logout() {
    if(confirm("确定退出登录吗？")) {
        localStorage.removeItem("user");
        window.location.href = "/index.html";
    }
}

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
}

// 点击空白关闭搜索结果
document.addEventListener("click", e => {
    if(!e.target.closest('.friend-search')) {
        document.getElementById("searchResult").classList.remove('show');
    }
});

// 初始化
loadPosts();
loadAllGames();
</script>
