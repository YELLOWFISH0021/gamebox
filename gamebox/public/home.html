<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏社区 - 内嵌沙盒联机</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#1a1a22;color:#eee;padding:12px}
.login-box{max-width:420px;margin:30px auto;background:#272733;padding:20px;border-radius:10px}
.panel{background:#272733;border-radius:10px;padding:14px;margin:10px 0}
input,textarea{width:100%;padding:8px;margin:6px 0;background:#333;border:1px solid #444;color:#fff;border-radius:6px}
button{padding:8px 14px;border:none;border-radius:6px;cursor:pointer;margin:4px;background:#2385d0;color:white}
button.secondary{background:#444}
button.invite-btn{background:#27ae60}
.flex{display:flex;gap:8px;flex-wrap:wrap}
.msg-item{padding:8px;border-bottom:1px solid #333}
.invite-msg{background:#275038;padding:6px}
#chatArea{height:280px;overflow-y:auto;background:#222;padding:10px;border-radius:8px;margin:8px 0}

/* 内嵌沙盒容器 */
#sandboxWrap{display:none;position:fixed;inset:0;background:#000;z-index:100}
#sandboxCanvas{display:block;background:#87CEEB}
#sandboxMenu{position:absolute;inset:0;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:10}
#sandboxHud{position:absolute;top:10px;left:10px;z-index:9;gap:8px;flex-direction:column;display:none}
#sandboxChatBox{position:absolute;bottom:10px;left:10px;z-index:9;display:none;flex-direction:column;gap:4px}
#sandboxChatLog{width:280px;height:120px;background:rgba(0,0,0,0.6);border-radius:6px;padding:8px;font-size:12px;overflow-y:auto}
#sandboxChatInput{width:280px;padding:6px 8px;border-radius:6px;border:1px solid #444;background:#222;color:#fff;font-size:12px}
</style>
</head>
<body>
<div id="loginBox" class="login-box">
  <h2>登录 / 注册</h2>
  <input id="userIn" placeholder="用户名">
  <input id="passIn" type="password" placeholder="密码">
  <div class="flex">
    <button onclick="register()">注册</button>
    <button onclick="login()">登录</button>
  </div>
</div>

<div id="mainPage" style="display:none">
  <h2>欢迎 <span id="myName"></span></h2>

  <div class="panel">
    <h3>搜索用户添加好友</h3>
    <div class="flex">
      <input id="searchUser" placeholder="输入用户名">
      <button onclick="searchUser()">搜索</button>
    </div>
    <div id="searchResult"></div>
  </div>

  <div class="panel">
    <h3>好友申请</h3>
    <div id="applyList"></div>
  </div>

  <div class="panel">
    <h3>我的好友</h3>
    <div id="friendList"></div>
  </div>

  <div class="panel">
    <h3>私聊窗口</h3>
    <div>选择好友：<select id="chatTarget" onchange="loadChat()"></select></div>
    <div id="chatArea"></div>
    <input id="msgInput" placeholder="文字消息" onkeydown="if(event.key==='Enter')sendMsg()">
    <div class="flex">
      <button onclick="document.getElementById('imgUpload').click()">发送图片</button>
      <input type="file" id="imgUpload" accept="image/*" style="display:none" onchange="sendImage(this)">
      <button onclick="document.getElementById('fileUpload').click()">发送文件</button>
      <input type="file" id="fileUpload" style="display:none" onchange="sendFile(this)">
      <button class="invite-btn" onclick="sendGameInvite()">邀请玩沙盒联机</button>
    </div>
  </div>
</div>

<!-- ========== 内嵌沙盒游戏 ========== -->
<div id="sandboxWrap">
  <div id="sandboxMenu">
    <h1>像素方块世界</h1>
    <div>WASD移动 · 空格跳跃 · 左键破坏 · 右键放置</div>
    <div class="flex">
      <input id="roomInput" placeholder="房间号">
    </div>
    <div class="flex">
      <input id="nameInput" placeholder="你的昵称" value="玩家">
    </div>
    <div class="flex">
      <button class="secondary" onclick="startOnline()">联机开始</button>
      <button onclick="startSingle()">单机开始</button>
      <button onclick="closeSandbox()">关闭游戏</button>
    </div>
  </div>

  <div id="sandboxHud">
    <div class="flex">
      <button id="fullscreenBtn">全屏</button>
      <span id="roomInfo"></span>
    </div>
    <div id="playerList"></div>
  </div>

  <div id="sandboxChatBox">
    <div id="sandboxChatLog"></div>
    <input id="sandboxChatInput" placeholder="回车发送聊天..." onkeydown="if(event.key==='Enter')sendSandboxChat()">
  </div>

  <canvas id="sandboxCanvas"></canvas>
</div>

<script>
let currentUser = "";
let chatWith = "";
const api = "";

// ========== 社区好友私聊代码 ==========
async function register(){
  const u = document.getElementById("userIn").value.trim();
  const p = document.getElementById("passIn").value.trim();
  const res = await fetch(api+"/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})})
  const d = await res.json();
  alert(d.msg || (d.ok?"注册成功":"注册失败"));
}
async function login(){
  const u = document.getElementById("userIn").value.trim();
  const p = document.getElementById("passIn").value.trim();
  const res = await fetch(api+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})})
  const d = await res.json();
  if(d.ok){
    currentUser = u;
    document.getElementById("loginBox").style.display="none";
    document.getElementById("mainPage").style.display="block";
    document.getElementById("myName").innerText = currentUser;
    refreshFriend();
    refreshApply();
  }else alert(d.msg);
}
async function searchUser(){
  const q = document.getElementById("searchUser").value.trim();
  const res = await fetch(api+`/api/searchUser?q=${encodeURIComponent(q)}`);
  const d = await res.json();
  let html = "";
  d.list.forEach(name=>{
    html += `<div>${name} <button onclick="applyFriend('${name}')">发送好友申请</button></div>`
  })
  document.getElementById("searchResult").innerHTML = html;
}
async function applyFriend(target){
  const res = await fetch(api+"/api/sendApply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({from:currentUser,to:target})})
  const d = await res.json();
  alert(d.ok?"申请已发送":d.msg);
}
async function refreshApply(){
  const res = await fetch(api+`/api/getApply?user=${currentUser}`);
  const d = await res.json();
  let html = "";
  d.list.forEach(name=>{
    html += `<div>${name} <button onclick="handleApply('${name}',true)">同意</button><button onclick="handleApply('${name}',false)">拒绝</button></div>`
  })
  document.getElementById("applyList").innerHTML = html;
}
async function handleApply(other, accept){
  await fetch(api+"/api/handleApply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({me:currentUser,other,accept})})
  refreshApply();refreshFriend();
}
async function refreshFriend(){
  const res = await fetch(api+`/api/getFriends?user=${currentUser}`);
  const d = await res.json();
  let html = "";
  let optHtml = "<option value=''>请选择</option>";
  d.list.forEach(name=>{
    html += `<div>${name}</div>`;
    optHtml += `<option value="${name}">${name}</option>`
  })
  document.getElementById("friendList").innerHTML = html;
  document.getElementById("chatTarget").innerHTML = optHtml;
}
document.getElementById("chatTarget").onchange = function(){chatWith=this.value;loadChat()}

async function loadChat(){
  if(!chatWith) return;
  const res = await fetch(api+`/api/getPrivateMsg?u1=${currentUser}&u2=${chatWith}`);
  const d = await res.json();
  let html = "";
  d.list.forEach(m=>{
    if(m.msgType==="text") html
