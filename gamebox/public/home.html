<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>游戏社区盒子 | 科技版</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

:root {
    --bg-main: #0a0e17;
    --bg-card: #111827;
    --border-color: #1e293b;
    --primary: #0ea5e9;
    --primary-glow: rgba(14, 165, 233, 0.4);
    --text-main: #e2e8f0;
    --text-sub: #94a3b8;
    --success: #10b981;
    --purple: #8b5cf6;
}

html, body {
    width: 100%;
    overflow-x: hidden;
}

body {
    background: 
        radial-gradient(circle at 20% 20%, rgba(14, 165, 233, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
        linear-gradient(135deg, #0a0e17 0%, #0f172a 100%);
    background-attachment: fixed;
    color: var(--text-main);
    min-height: 100vh;
    line-height: 1.6;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(14, 165, 233, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14, 165, 233, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
}

.navbar {
    height: 56px;
    background: rgba(17, 24, 39, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}
.nav-inner {
    max-width: 1400px;
    height: 100%;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
}
.nav-logo {
    font-size: 16px;
    font-weight: 700;
    background: linear-gradient(90deg, #0ea5e9, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.5px;
}
.nav-user {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
}
.user-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #fff;
    font-size: 12px;
    box-shadow: 0 0 12px var(--primary-glow);
}
.logout-btn {
    padding: 5px 12px;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-sub);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
}
.logout-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.container {
    max-width: 1400px;
    margin: 20px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 20px;
    align-items: start;
    position: relative;
    z-index: 1;
}

.sidebar {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 12px 0;
    position: sticky;
    top: 76px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.menu-item {
    padding: 10px 20px;
    font-size: 14px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.25s;
    border-left: 3px solid transparent;
    display: flex;
    align-items: center;
    gap: 8px;
}
.menu-item:hover {
    background: rgba(14, 165, 233, 0.08);
    color: var(--primary);
}
.menu-item.active {
    background: rgba(14, 165, 233, 0.12);
    color: var(--primary);
    border-left-color: var(--primary);
    font-weight: 500;
}

.sidebar-stats {
    margin: 12px 14px 0;
    padding: 12px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-sub);
}
.stat-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
}
.stat-row:last-child {
    margin-bottom: 0;
}
.stat-num {
    color: var(--primary);
    font-weight: 600;
}

.main {
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.panel {
    display: none;
    flex-direction: column;
    gap: 16px;
}
.panel.active {
    display: flex;
}

.card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    transition: all 0.3s;
    position: relative;
}
.card:hover {
    border-color: rgba(14, 165, 233, 0.4);
}
.card-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text-main);
}
.card-title-left {
    display: flex;
    align-items: center;
    gap: 8px;
}
.card-title-left::before {
    content: "";
    width: 3px;
    height: 14px;
    background: linear-gradient(180deg, #0ea5e9, #8b5cf6);
    border-radius: 2px;
}

.notice-bar {
    padding: 10px 14px;
    background: linear-gradient(90deg, rgba(14, 165, 233, 0.15), rgba(139, 92, 246, 0.15));
    border: 1px solid rgba(14, 165, 233, 0.3);
    border-radius: 8px;
    font-size: 12px;
    color: #7dd3fc;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
}

input, textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    background: #0f172a;
    color: var(--text-main);
    transition: all 0.2s;
    margin-bottom: 10px;
}
input:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
}
textarea {
    resize: vertical;
    min-height: 80px;
}
.btn {
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #0ea5e9, #2563eb);
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
}
.btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(14, 165, 233, 0.35);
}
.btn-ghost {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-sub);
    box-shadow: none;
}
.btn-ghost:hover {
    border-color: var(--primary);
    color: var(--primary);
    transform: none;
    box-shadow: none;
}

.sort-group {
    display: flex;
    gap: 6px;
}
.sort-btn {
    padding: 4px 10px;
    font-size: 11px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
}
.sort-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
}

.post-item {
    padding: 14px;
    background: #0f172a;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    margin-bottom: 10px;
    transition: all 0.2s;
}
.post-item:hover {
    border-color: rgba(14, 165, 233, 0.3);
}
.post-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}
.post-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
}
.post-meta {
    font-size: 11px;
    color: var(--text-sub);
}
.post-content {
    font-size: 13px;
    color: var(--text-main);
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 8px;
}
.post-footer {
    display: flex;
    gap: 14px;
    padding-top: 6px;
    border-top: 1px solid var(--border-color);
}
.post-action {
    font-size: 11px;
    color: var(--text-sub);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: color 0.2s;
    user-select: none;
}
.post-action:hover {
    color: var(--primary);
}
.post-action.liked {
    color: var(--primary);
}

.game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
}
.game-card {
    background: #0f172a;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s;
}
.game-card:hover {
    transform: translateY(-3px);
    border-color: var(--primary);
    box-shadow: 0 8px 24px rgba(14, 165, 233, 0.2);
}
.game-cover {
    height: 100px;
    background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    position: relative;
}
.game-cover::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 40%;
    background: linear-gradient(transparent, rgba(0,0,0,0.3));
}
.game-info {
    padding: 10px;
}
.game-name {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.game-meta {
    font-size: 11px;
    color: var(--text-sub);
    display: flex;
    justify-content: space-between;
}
.play-count {
    color: var(--success);
}

.search-box {
    position: relative;
    margin-bottom: 14px;
}
.search-box input {
    margin-bottom: 0;
    padding-left: 34px;
}
.search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-sub);
    font-size: 14px;
}

.empty {
    padding: 30px;
    text-align: center;
    color: var(--text-sub);
    font-size: 13px;
    border: 1px dashed var(--border-color);
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.5);
    grid-column: 1/-1;
}

.upload-form {
    display: none;
    margin-bottom: 18px;
    padding: 14px;
    background: #0a0e17;
    border-radius: 8px;
    border: 1px solid var(--border-color);
}
.upload-form.show {
    display: block;
}

@media screen and (max-width: 900px) {
    .container {
        grid-template-columns: 1fr;
    }
    .sidebar {
        position: static;
        flex-direction: row;
        overflow-x: auto;
        padding: 6px;
    }
    .menu-item {
        flex-shrink: 0;
        border-left: none;
        border-bottom: 3px solid transparent;
        padding: 8px 14px;
    }
    .menu-item.active {
        border-left: none;
        border-bottom-color: var(--primary);
    }
    .sidebar-stats {
        display: none;
    }
    .game-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    }
}

@media screen and (max-width: 500px) {
    .nav-logo { font-size: 14px; }
    .nav-user span { display: none; }
    .game-cover { height: 80px; font-size: 28px; }
}

@media screen and (orientation: landscape) and (max-width: 900px) {
    .game-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }
}
</style>
</head>
<body>

<div class="navbar">
    <div class="nav-inner">
        <div class="nav-logo">🎮 游戏社区盒子</div>
        <div class="nav-user">
            <div class="user-avatar" id="userAvatar">--</div>
            <span id="userName">--</span>
            <button class="logout-btn" onclick="logout()">退出</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="sidebar">
        <div class="menu-item active" onclick="switchPanel('post', this)">
            <span>💬</span> 社区帖子
        </div>
        <div class="menu-item" onclick="switchPanel('square', this)">
            <span>🎯</span> 游戏广场
        </div>
        <div class="menu-item" onclick="switchPanel('library', this)">
            <span>📚</span> 游戏库
        </div>
        
        <div class="sidebar-stats">
            <div class="stat-row">
                <span>🎮 游戏总数</span>
                <span class="stat-num" id="statGames">0</span>
            </div>
            <div class="stat-row">
                <span>💬 帖子总数</span>
                <span class="stat-num" id="statPosts">0</span>
            </div>
            <div class="stat-row">
                <span>👤 注册用户</span>
                <span class="stat-num" id="statUsers">0</span>
            </div>
        </div>
    </div>

    <div class="main">
        <!-- 社区帖子 -->
        <div class="panel active" id="postPanel">
            <div class="card">
                <div class="notice-bar">
                    <span>📢</span>
                    欢迎来到游戏社区！上传HTML小游戏、分享心得，和大家一起玩～
                </div>
                <div class="card-title">
                    <div class="card-title-left">发布新帖子</div>
                </div>
                <textarea id="postContent" placeholder="分享你的游戏心得、问题讨论或新鲜事..."></textarea>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:12px; color:var(--text-sub);"><span id="charCount">0</span> 字</span>
                    <button class="btn" onclick="sendPost()">发布帖子</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <div class="card-title-left">全部帖子</div>
                </div>
                <div id="postList"></div>
            </div>
        </div>

        <!-- 游戏广场 -->
        <div class="panel" id="squarePanel">
            <div class="card">
                <div class="card-title">
                    <div class="card-title-left">🔥 最新上架</div>
                    <span style="font-size:11px;color:var(--text-sub);font-weight:normal;">云端同步 · 全员可见</span>
                </div>
                <div id="squareGameList" class="game-grid"></div>
            </div>
        </div>

        <!-- 游戏库 -->
        <div class="panel" id="libraryPanel">
            <div class="card">
                <div class="card-title">
                    <div class="card-title-left">📚 全部游戏库</div>
                    <div class="sort-group">
                        <button class="sort-btn active" onclick="sortGames('new', this)">最新发布</button>
                        <button class="sort-btn" onclick="sortGames('hot', this)">最多游玩</button>
                    </div>
                </div>
                
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input id="gameSearch" placeholder="搜索游戏名称或作者..." oninput="searchGames()">
                </div>

                <div style="margin-bottom:14px;">
                    <button class="btn" onclick="toggleUploadForm()">⬆️ 上传新游戏</button>
                </div>
                
                <div class="upload-form" id="uploadForm">
                    <div style="font-weight:500; margin-bottom:8px; font-size:13px;">上传HTML游戏</div>
                    <input id="gameName" placeholder="游戏名称">
                    <textarea id="gameCode" rows="4" placeholder="粘贴完整HTML游戏代码"></textarea>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:11px; color:var(--text-sub);">上传后自动同步云端，所有玩家可见</span>
                        <button class="btn" onclick="uploadGame()">确认上传</button>
                    </div>
                </div>

                <div id="libraryGameList" class="game-grid"></div>
            </div>
        </div>

    </div>
</div>

<script>
const username = localStorage.getItem("user");
if(!username) window.location.href = "/index.html";

document.getElementById("userName").textContent = username;
document.getElementById("userAvatar").textContent = username.charAt(0).toUpperCase();

let allGames = [];
let allPosts = [];
let currentSort = "new";

// 切换面板
function switchPanel(name, el) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
    
    document.getElementById(name + 'Panel').classList.add('active');
    el.classList.add('active');

    if(name === 'post') loadPosts();
    if(name === 'square' || name === 'library') loadAllGames();
}

// 帖子字数
document.getElementById("postContent").addEventListener("input", function(){
    document.getElementById("charCount").textContent = this.value.length;
});

// 更新统计
async function updateStats() {
    document.getElementById("statGames").textContent = allGames.length;
    document.getElementById("statPosts").textContent = allPosts.length;
    try {
        const res = await fetch("/api/usercount");
        const data = await res.json();
        document.getElementById("statUsers").textContent = data.count;
    } catch(e) {}
}

// 加载帖子
async function loadPosts() {
    try {
        const res = await fetch("/api/posts");
        allPosts = await res.json();
        const div = document.getElementById("postList");
        
        if(allPosts.length === 0) {
            div.innerHTML = '<div class="empty">还没有帖子，快来发布第一条吧～</div>';
            updateStats();
            return;
        }

        div.innerHTML = "";
        allPosts.forEach((p, idx) => {
            const item = document.createElement("div");
            item.className = "post-item";
            const liked = p.likedUsers && p.likedUsers.includes(username);
            item.innerHTML = `
                <div class="post-head">
                    <div class="post-avatar">${(p.user || "?").charAt(0).toUpperCase()}</div>
                    <div class="post-meta">
                        <span style="color:var(--text-main); font-weight:500;">${escapeHtml(p.user || "匿名")}</span>
                        &nbsp;·&nbsp; ${escapeHtml(p.time || "")}
                    </div>
                </div>
                <div class="post-content">${escapeHtml(p.content || "")}</div>
                <div class="post-footer">
                    <div class="post-action ${liked ? 'liked' : ''}" onclick="likePost(${idx}, this)">
                        <span>👍</span> <span class="like-num">${p.likeCount || 0}</span> 点赞
                    </div>
                    <div class="post-action">
                        <span>💬</span> 回复
                    </div>
                </div>
            `;
            div.appendChild(item);
        });
        updateStats();
    } catch(e) {
        document.getElementById("postList").innerHTML = '<div class="empty">帖子加载失败</div>';
    }
}

// 点赞（云端同步）
async function likePost(idx, el) {
    if(el.classList.contains('liked')) return;
    try {
        const res = await fetch("/api/like", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({postId: idx, username: username})
        });
        const data = await res.json();
        el.classList.add('liked');
        el.querySelector('.like-num').textContent = data.likeCount;
        allPosts[idx].likeCount = data.likeCount;
    } catch(e) {
        alert("点赞失败");
    }
}

// 发帖
async function sendPost() {
    const content = document.getElementById("postContent").value;
    if(!content.trim()) {
        alert("帖子内容不能为空！");
        return;
    }

    try {
        await fetch("/api/post", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({user: username, content})
        });
        document.getElementById("postContent").value = "";
        document.getElementById("charCount").textContent = "0";
        alert("发布成功！");
        loadPosts();
    } catch(e) {
        alert("发帖失败：" + e.message);
    }
}

// 加载全部游戏
async function loadAllGames() {
    try {
        const res = await fetch("/api/games");
        allGames = await res.json();
        
        renderGameList("squareGameList", allGames.slice(0, 6), 0);
        const list = currentSort === "new" ? allGames : [...allGames].sort((a,b) => (b.playCount||0) - (a.playCount||0));
        renderGameList("libraryGameList", list, currentSort === "new" ? 0 : allGames.indexOf(list[0]));
        updateStats();
    } catch(e) {
        console.error("游戏加载失败", e);
    }
}

// 渲染游戏列表（修复跳转索引）
function renderGameList(elementId, list, startIndex) {
    const div = document.getElementById(elementId);
    if(list.length === 0) {
        div.innerHTML = '<div class="empty">暂无游戏，快去上传第一个吧</div>';
        return;
    }

    div.innerHTML = "";
    list.forEach((g, i) => {
        const realIndex = allGames.indexOf(g);
        const card = document.createElement("div");
        card.className = "game-card";
        card.onclick = () => playGame(realIndex);
        card.innerHTML = `
            <div class="game-cover">🎮</div>
            <div class="game-info">
                <div class="game-name">${escapeHtml(g.name || "未命名游戏")}</div>
                <div class="game-meta">
                    <span>作者：${escapeHtml(g.user || "匿名")}</span>
                    <span class="play-count">▶ ${g.playCount || 0}</span>
                </div>
            </div>
        `;
        div.appendChild(card);
    });
}

// 搜索游戏
function searchGames() {
    const keyword = document.getElementById("gameSearch").value.toLowerCase().trim();
    if(!keyword) {
        sortGames(currentSort, document.querySelector('.sort-btn.active'));
        return;
    }
    const filtered = allGames.filter(g => 
        g.name.toLowerCase().includes(keyword) || 
        g.user.toLowerCase().includes(keyword)
    );
    renderGameList("libraryGameList", filtered, 0);
}

// 排序游戏
function sortGames(type, el) {
    currentSort = type;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    
    let sorted = [...allGames];
    if(type === 'hot') {
        sorted.sort((a,b) => (b.playCount||0) - (a.playCount||0));
    }
    renderGameList("libraryGameList", sorted, 0);
}

// 切换上传表单
function toggleUploadForm() {
    document.getElementById("uploadForm").classList.toggle('show');
}

// 上传游戏
async function uploadGame() {
    const name = document.getElementById("gameName").value;
    const code = document.getElementById("gameCode").value;

    if(!name.trim() || !code.trim()) {
        alert("请填写游戏名称和完整代码！");
        return;
    }

    try {
        await fetch("/api/uploadgame", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({user: username, name, code})
        });
        
        alert("上传成功！已同步到云端，所有玩家均可看见");
        document.getElementById("gameName").value = "";
        document.getElementById("gameCode").value = "";
        document.getElementById("uploadForm").classList.remove('show');
        loadAllGames();
    } catch(e) {
        alert("上传失败：" + e.message);
    }
}

// 打开游戏
async function playGame(id) {
    try {
        await fetch(`/api/playgame?id=${id}`);
    } catch(e) {}
    window.location.href = `/game.html?id=${id}`;
}

// 退出登录
function logout() {
    if(confirm("确定退出登录吗？")) {
        localStorage.removeItem("user");
        window.location.href = "/index.html";
    }
}

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
}

// 初始化
loadPosts();
loadAllGames();
</script>
