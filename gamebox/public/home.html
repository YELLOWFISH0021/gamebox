<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社区主页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{padding:15px;font-family:system-ui;}
button{padding:5px 10px;margin:3px;}
input,textarea{width:100%;padding:6px;margin:4px 0;}
.item{padding:8px;margin:6px 0;border:1px solid #aaa;cursor:pointer;}
.post-item{padding:8px;margin:6px 0;border:1px solid #aaa;}
</style>
</head>
<body>
<h2>游戏社区</h2>

<div>
    <h3>上传HTML游戏</h3>
    <input id="gameName" placeholder="游戏名称">
    <textarea id="gameCode" rows="6" placeholder="粘贴HTML游戏完整代码"></textarea>
    <button onclick="uploadGame()">上传游戏</button>
</div>

<div style="margin-top:15px;">
    <h3>游戏列表（点击游玩）</h3>
    <div id="gameList"></div>
</div>

<div style="margin-top:15px;">
    <h3>发帖</h3>
    <textarea id="postContent" rows="3" placeholder="输入帖子内容"></textarea>
    <button onclick="sendPost()">发布帖子</button>
</div>

<div style="margin-top:15px;">
    <h3>社区帖子</h3>
    <div id="postList"></div>
</div>

<script>
const username = localStorage.getItem("user")
if(!username) window.location.href="/index.html"

async function loadGames(){
    try{
        const res = await fetch("/api/games")
        const list = await res.json()
        const div = document.getElementById("gameList")
        div.innerHTML=""
        list.forEach((g,idx)=>{
            div.innerHTML += `<div class="item" onclick="playGame(${idx})">${g.name} | 作者：${g.user}</div>`
        })
    }catch(e){
        alert("游戏列表加载失败")
    }
}
function playGame(id){
    window.location.href = `/game.html?id=${id}`
}
async function uploadGame(){
    try{
        const name = document.getElementById("gameName").value
        const code = document.getElementById("gameCode").value
        await fetch("/api/uploadgame",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({user:username,name,code})
        })
        loadGames()
        alert("上传成功！")
    }catch(e){
        alert("上传失败："+e)
    }
}

async function loadPosts(){
    try{
        const res = await fetch("/api/posts")
        const list = await res.json()
        const div = document.getElementById("postList")
        div.innerHTML=""
        list.forEach(p=>{
            div.innerHTML += `<div class="post-item">${p.user} ${p.time}：${p.content}</div>`
        })
    }catch(e){
        alert("帖子加载失败："+e)
    }
}
async function sendPost(){
    try{
        const content = document.getElementById("postContent").value
        if(!content.trim()){
            alert("内容不能为空！")
            return
        }
        await fetch("/api/post",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({user:username,content})
        })
        loadPosts()
        document.getElementById("postContent").value=""
        alert("发帖成功！")
    }catch(e){
        alert("发帖失败！"+e)
    }
}

loadGames()
loadPosts()
</script>
</body>
</html>
