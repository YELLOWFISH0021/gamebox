<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏社区盒子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui;
        }
        body {
            background: #121826;
            color:#fff;
            min-height:100vh;
        }
        .container{
            max-width:900px;
            margin:0 auto;
            padding:30px;
        }
        .login-box{
            width:380px;
            margin:80px auto;
            background:#1f2940;
            padding:28px;
            border-radius:12px;
            border:1px solid #334160;
        }
        .login-box h2{
            text-align:center;
            margin-bottom:24px;
            color:#93c5fd;
        }
        .input-item{
            margin-bottom:16px;
        }
        .input-item label{
            display:block;
            margin-bottom:6px;
            font-size:14px;
        }
        .input-item input{
            width:100%;
            padding:10px 12px;
            border-radius:6px;
            border:none;
            font-size:16px;
            background:#27334d;
            color:white;
        }
        button{
            width:100%;
            padding:11px;
            border-radius:6px;
            border:none;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
            margin:4px 0;
        }
        button:hover{
            background:#1d4ed8;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="login-box">
        <h2>游戏社区盒子</h2>
        <div class="input-item">
            <label>用户名</label>
            <input id="username" type="text" placeholder="输入用户名">
        </div>
        <div class="input-item">
            <label>密码</label>
            <input id="pwd" type="password" placeholder="输入密码">
        </div>
        <button onclick="login()">登录</button>
        <button onclick="register()">注册新账号</button>
    </div>
</div>

<script>
async function login(){
    const user = document.getElementById('username').value
    const pwd = document.getElementById('pwd').value
    if(!user || !pwd){
        alert("用户名密码不能为空！")
        return
    }
    const res = await fetch("/api/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:user,password:pwd,action:"login"})
    })
    const data = await res.json()
    if(data.success){
        localStorage.setItem("user",user)
        window.location.href="/home.html"
    }else{
        alert(data.msg)
    }
}

async function register(){
    const user = document.getElementById('username').value
    const pwd = document.getElementById('pwd').value
    if(!user || !pwd){
        alert("用户名密码不能为空！")
        return
    }
    const res = await fetch("/api/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:user,password:pwd,action:"register"})
    })
    const data = await res.json()
    if(data.success){
        localStorage.setItem("user",user)
        window.location.href="/home.html"
    }else{
        alert(data.msg)
    }
}
</script>
</body>
</html>
