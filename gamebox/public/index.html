<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏社区盒子</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#1a1a2e;color:#fff;padding:16px}
.container{max-width:1000px;margin:0 auto}
.card{background:#27293d;border-radius:12px;padding:16px;margin:12px 0}
button{padding:8px 14px;background:#4361ee;color:#fff;border:none;border-radius:8px;cursor:pointer;margin:4px}
textarea,input{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:0}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
  <h1>🎮游戏社区盒子</h1>
  <div id="loginBox" class="card">
    <h3>注册账号</h3>
    <input id="usr" placeholder="用户名">
    <input id="pwd" type="password" placeholder="密码">
    <button onclick="register()">注册进入</button>
  </div>

  <div id="mainBox" class="hidden">
    <div class="card">
      <h3>📝社区发帖</h3>
      <textarea id="postTxt" placeholder="发帖子聊天"></textarea>
      <button onclick="sendPost">发布</button>
    </div>
    <div class="card">
      <h3>📤上传HTML游戏</h3>
      <input id="gname" placeholder="游戏名字">
      <textarea id="gcode" style="height:180px" placeholder="粘贴游戏完整HTML代码"></textarea>
      <button onclick="uploadGame()">上传游戏</button>
    </div>
    <div class="card">
      <h3>🕹️游戏列表</h3>
      <div id="gameList"></div>
    </div>
    <div class="card">
      <h3>💬社区帖子</h3>
      <div id="postList"></div>
    </div>
  </div>
</div>
<script>
let username=null;
const api=window.location.origin;
async function register(){
  const usr=document.getElementById("usr").value;
  const pwd=document.getElementById("pwd").value;
  const res=await fetch(api+"/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:usr,password:pwd})})
  const d=await res.json();
  if(d.ok){
    username=usr;
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("mainBox").classList.remove("hidden");
    loadPosts();loadGames();
  }else alert(d.msg);
}
async function sendPost(){
  const content=document.getElementById("postTxt").value;
  await fetch(api+"/api/post",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,content})})
  loadPosts();document.getElementById("postTxt").value="";
}
async function loadPosts(){
  const res=await fetch(api+"/api/posts");
  const list=await res.json();
  document.getElementById("postList").innerHTML=list.map(x=>`<p>[${x.time}] ${x.username}: ${x.content}</p>`).join("");
}
async function uploadGame(){
  const name=document.getElementById("gname").value;
  const code=document.getElementById("gcode").value;
  await fetch(api+"/api/uploadgame",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,code,author:username})})
  loadGames();
}
async function loadGames(){
  const res=await fetch(api+"/api/games");
  const games=await res.json();
  document.getElementById("gameList").innerHTML=games.map(g=>`
    <div style="padding:8px;border:1px solid #444;margin:6px;border-radius:8px">
      <b>${g.name}</b> by ${g.author}
      <button onclick="openGame(${g.id})">打开游戏</button>
    </div>`).join("");
}
async function openGame(id){
  const res=await fetch(api+"/api/game/"+id);
  const g=await res.json();
  const w=window.open();
  w.document.write(g.code);
}
</script>
</body>
</html>
