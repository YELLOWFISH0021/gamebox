<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>游戏运行中 - 游戏社区盒子</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

:root {
    --bg-bar: #111827;
    --border-color: #1e293b;
    --primary: #0ea5e9;
    --text-main: #e2e8f0;
    --text-sub: #94a3b8;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* 顶部操作栏 */
.game-bar {
    height: 44px;
    background: rgba(17, 24, 39, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    position: relative;
    z-index: 10;
}

.bar-left, .bar-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.bar-btn {
    padding: 6px 12px;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-main);
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
}

.bar-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.game-title {
    font-size: 13px;
    color: var(--text-main);
    font-weight: 500;
    max-width: 50%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* 游戏容器 */
.game-container {
    width: 100%;
    height: calc(100% - 44px);
    position: relative;
    background: #000;
}

#gameFrame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

/* 加载提示 */
.loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--text-sub);
    font-size: 14px;
}

/* 横屏优化 */
@media screen and (orientation: landscape) {
    .game-bar {
        height: 36px;
    }
    .game-container {
        height: calc(100% - 36px);
    }
}

/* 全屏模式 */
:fullscreen .game-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
}
</style>
</head>
<body>

<div class="game-bar">
    <div class="bar-left">
        <button class="bar-btn" onclick="goBack()">← 返回</button>
    </div>
    <div class="game-title" id="gameTitle">加载中...</div>
    <div class="bar-right">
        <button class="bar-btn" onclick="toggleFullscreen()">⛶ 全屏</button>
    </div>
</div>

<div class="game-container">
    <div class="loading" id="loading">游戏加载中...</div>
    <iframe id="gameFrame" allowfullscreen></iframe>
</div>

<script>
const username = localStorage.getItem("user");
if(!username) window.location.href = "/index.html";

const params = new URLSearchParams(location.search);
const gameId = params.get("id");

async function loadGame() {
    try {
        const res = await fetch(`/api/getgame?id=${gameId}`);
        const game = await res.json();
        
        if(!game || !game.code) {
            document.getElementById("loading").textContent = "游戏不存在";
            return;
        }

        document.getElementById("gameTitle").textContent = game.name || "未命名游戏";
        const iframe = document.getElementById("gameFrame");
        iframe.srcdoc = game.code;
        iframe.onload = () => {
            document.getElementById("loading").style.display = "none";
        };
    } catch(e) {
        document.getElementById("loading").textContent = "游戏加载失败";
    }
}

// 返回社区
function goBack() {
    window.location.href = "/home.html";
}

// 全屏切换
function toggleFullscreen() {
    if(!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            alert("无法进入全屏模式");
        });
    } else {
        document.exitFullscreen();
    }
}

// 加载游戏
loadGame();
</script>
</body>
</html>
